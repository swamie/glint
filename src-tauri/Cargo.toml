[package]
name = "glint"
version = "0.1.2"
edition = "2021"
description = "Offline instant-replay clipper"
default-run = "glint"

# The app itself.
[[bin]]
name = "glint"
path = "src/main.rs"

# The one-time installer, shipped as GlintSetup.exe.
[[bin]]
name = "glint-setup"
path = "src/setup.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clipboard-win = "5"
rfd = "0.15"
winreg = "0.52"
trash = "5"
# RNNoise in pure Rust, model included: microphone noise suppression.
nnnoiseless = { version = "0.5", default-features = false }
# Writes game icons taken from executables.
png = "0.17"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
